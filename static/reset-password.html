<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HITMAN AI • Reset password</title><link rel="stylesheet" href="/static/auth.css"><style>body{background:#0b1020;color:#f1f5ff;font-family:system-ui}.card{padding:30px;max-width:440px;margin:20px auto;background:#151d32;border-radius:12px}input,button{display:block;width:100%;padding:12px;margin:10px 0;background:#24304c;color:white;border:1px solid #506187;border-radius:8px}button{background:#4c70f2;cursor:pointer}a{color:#adbfff}#result{white-space:pre-wrap}</style></head><body><main class="auth-shell"><div class="brand">✦ HITMAN <span class="accent">AI</span></div><section class="card"><h1>Reset password</h1><p>Choose a new password. Other active sessions will be signed out.</p><form id="resetForm"><label>Reset token</label><input id="token" required autocomplete="off"><label>New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label>Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button class="submit" type="submit">Set new password</button></form><p id="result" role="status"></p><a href="/login">Back to sign in</a></section></main><script src="/static/recovery.js" defer></script></body></html>
