# Optional Render Blueprint for a chat-only anonymous preview (Free plan).
# If you already have a Render web service, DO NOT create another service;
# instead add HITMAN_PUBLIC_DEMO=1 in the existing service's Environment tab.
# No email service, persistent disk or account data is needed in demo mode.
services:
  - type: web
    name: hitman-ai-public-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: '1'
      - key: HITMAN_PUBLIC_DEMO
        value: '1'
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REASONING_MODEL
        value: gemini-3.5-flash-lite
      - key: HITMAN_PUBLIC_PROJECTS
        value: '0'
      - key: HITMAN_PUBLIC_STUDIO_BUILD
        value: '0'
      - key: HITMAN_PUBLIC_STUDIO_REVIEW
        value: '0'
      - key: HITMAN_LOCAL_DOCKER_AGENT
        value: '0'
      - key: HITMAN_PRO_REVIEW
        value: '0'
      - key: HITMAN_PRO_PUBLIC
        value: '0'
      - key: HITMAN_PRO_GROUNDING
        value: '0'
      - key: HITMAN_PUBLIC_RESEARCH
        value: '0'
      - key: HITMAN_PUBLIC_IMAGE
        value: '0'
      - key: HITMAN_PUBLIC_REPAIR
        value: '0'
      - key: HITMAN_PUBLIC_LIVE_VOICE
        value: '0'
      - key: HITMAN_TEXT_PROVIDER
        value: gemini
      - key: GEMINI_ENABLE_SEARCH
        value: '0'
      - key: HITMAN_AUTO_WEB_SEARCH
        value: '0'
      - key: GEMINI_ENABLE_CODE_EXECUTION
        value: '0'
      - key: GEMINI_ENABLE_IMAGES
        value: '0'
      - key: ENABLE_DOCKER_TESTS
        value: '0'
      - key: ENABLE_DEP_INSTALL
        value: '0'
