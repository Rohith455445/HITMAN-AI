# Render Blueprint for public HITMAN AI with persistent SQLite and SMTP.
# COST WARNING: a paid web service + paid persistent disk are required.
# Render Free cannot provide durable local SQLite or SMTP on 587/465/25.
services:
  - type: web
    name: hitman-ai-gemini
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: hitman-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: '1'
      - key: ALLOW_FIRST_ADMIN_SETUP
        value: '0'
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REASONING_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_ENABLE_SEARCH
        value: '0'
      - key: GEMINI_ENABLE_CODE_EXECUTION
        value: '0'
      - key: GEMINI_ENABLE_IMAGES
        value: '0'
      - key: DATABASE_PATH
        value: /var/data/chats.db
      - key: PROJECT_STORAGE_PATH
        value: /var/data/generated_projects
      - key: ENABLE_DOCKER_TESTS
        value: '0'
      - key: ENABLE_DEP_INSTALL
        value: '0'
