<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HITMAN AI • Verify email</title><link rel="stylesheet" href="/static/auth.css"><style>body{background:#0b1020;color:#f1f5ff;font-family:system-ui}.card{padding:30px;max-width:440px;margin:20px auto;background:#151d32;border-radius:12px}input,button{display:block;width:100%;padding:12px;margin:10px 0;background:#24304c;color:white;border:1px solid #506187;border-radius:8px}button{background:#4c70f2;cursor:pointer}a{color:#adbfff}#result{white-space:pre-wrap}</style></head><body><main class="auth-shell"><div class="brand">✦ HITMAN <span class="accent">AI</span></div><section class="card"><h1>Verify email</h1><p>Use your link to activate your account.</p><form id="verifyForm"><label>Email verification token</label><input id="token" autocomplete="off" required placeholder="Token from your email"><button class="submit" type="submit">Verify email</button></form><hr><p>Need another link?</p><form id="resendForm"><label>Your email</label><input id="email" type="email" required placeholder="you@example.com"><button class="submit" type="submit">Resend verification</button></form><p id="result" role="status"></p><a href="/login">Back to sign in</a></section></main><script src="/static/recovery.js" defer></script></body></html>
