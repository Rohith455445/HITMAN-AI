<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HITMAN AI | Sign in</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="auth-shell"><div class="brand"><span class="spark">✦</span> HITMAN <span class="accent">AI</span></div>
<section class="card"><div class="eyebrow">DEVELOPER WORKSPACE</div><h1>Welcome back</h1><p class="intro">Sign in to access your HITMAN AI workspace.</p>
<form id="authForm" autocomplete="on"><label for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="Your username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_-]+" aria-describedby="userHelp"><small id="userHelp">3–40 letters, numbers, underscores or hyphens</small>
<label for="password">Password</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 12 characters" required minlength="12" maxlength="200"><button id="showPass" type="button" class="reveal" aria-label="Show password">Show</button></div>
<div id="error" role="alert" aria-live="polite"></div><button class="submit" id="submit" type="submit">Sign in</button></form>
<p class="switch"><a href="/forgot-password">Forgot password?</a> · <a href="/verify-email">Verify email</a></p><p class="switch">New to HITMAN AI? <a href="/signup">Create a free account</a></p></section><p class="foot">Private projects · Review AI code changes · Build with HITMAN AI</p></main>
<script src="/static/auth.js" defer></script></body></html>
